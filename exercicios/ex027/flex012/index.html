<!DOCTYPE html>
<html lang="pt-nr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box</title>

    <style>

        div.container {
            background-color: lightgreen;
            display: flex;
            flex-flow: row nowrap;
        }

        div.item {
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
            
           
        }

        div#cxA {
            /*
            flex-shrink: 0;
            flex-grow: 1;
            flex-basis: 250px;*/

            flex: 1 0 250px
        }

        div#cxB {
            /*
            flex-shrink: 2;
            flex-grow: 1;
            flex-basis: 250px;*/

            flex: 1 2 250px;
        }

        div#cxC {
            /*
            flex-shrink: 4;
            flex-grow: 0;
            flex-basis: 250px;*/

            flex: 0 4 250px;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="cxA">A</div>
        <div class="item" id="cxB">B</div>
        <div class="item" id="cxC">C</div>
    </div>
    
</body>
</html>
