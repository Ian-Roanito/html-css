<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>justify-content: space-evenly;</title>

    <style>

        div.container {
            background-color: lightgreen;
            display: flex;
            flex-flow: row nowrap;
            justify-content: space-evenly; /* Vai colocar os elementos dispostos dentro do container de forma que antes e depois dos items nós tenhamos espaçamento iguais*/
            
        }

        div.item {
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
        }

    </style>

</head>
<body>
    <h1>justify-content: space-evenly;</h1>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
    </div>
</body>
</html>
