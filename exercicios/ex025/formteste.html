<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Formulário de cadastro</h1>
    <form action="" method="post" autocomplete="on">
        <p>
            <label for="inome">Nome:</label>
            <input type="text" name="nome" id="inome" autocomplete="name" required minlength="3" maxlength="50" placeholder="Nome completo">
        </p>

        <p>
            <label for="iidade">Idade:</label>
            <input type="number" name="idade" id="iidade" required max="80" placeholder="Sua idade">
        </p>

        <p>
            <label for="inasc">Data de nascimento:</label>
            <input type="date" name="nasc" id="inasc" required>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</htm
