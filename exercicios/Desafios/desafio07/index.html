<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagem Flexível</title>
</head>
<body>
    <h1>Imagem Flexível</h1>
    <picture>
        <source media="(max-width: 660px)" srcset="imagens/paissagem-p.jpg" type="image/jpeg">

        <img  src="imagens/paissagem.jpg" alt="">
    </picture>
</body>
</html>
