<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            font-family: Arial, Helvetica, sans-serif;
        }

        section {
            background-color: brown;
            margin: 20px;
            height: 400px;
            display: flex;
            flex-flow: row nowrap;
            justify-content: center;
            align-items: center;
        }

        div {
            width: 300px;
            text-align: center;
            flex: 50%;
            min-width: 0;
            padding: 10px;
            display: flex;
            flex-flow: row nowrap;
            background-color: lightblue;
            border: 2px solid black;
        }

        p {
            flex: 1 1 auto;
            text-align: justify;
        }

       
    </style>
</head>
<body>
    <main>
        <section>
            <div><p>A Lorem, ipsum dolor sit amet consectetur adipisicing elit. Nesciunt perspiciatis doloremque quas ratione qui eaque, soluta velit </p></div>
            <div>B</div>
            <div>C</div>
            <div>D</div>
        </section>
    </main>
</body>
</html>
