<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-classes</title>

    <style>
        div {
            display: inline-block; /*Tudo na mesma linhas*/
            background-color: lightgray;
            border: 1px solid black; /*Cria uma borda*/
            text-align: center;
            height: 200px; /*Altura*/
            width: 200px; /*Largura*/
        }

        #d1:hover { /*Ao passar o mause/cursor em cima do objeto, muda a cor. :hover é quando o cursor passar em cima acontecerá uma coisa*/
            background-color: yellow;
        }



    </style>
</head>
<body>
    <div id="d1">01</div>
    <div id="d2">02</div>
    <div id="d3">03</div>
</body>
</html>
